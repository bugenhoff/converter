[project]
name = "converter-bot"
version = "2.0.0"
description = "Telegram-бот: .doc, .pdf и сканы страниц в .docx"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.5,<22",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "python-docx>=1.1",
    "pillow>=10.0",
    # Нужны только режимам llm_first и reliability_first (OCR и текстовый слой).
    "ocrmypdf>=16.0",
    "pdf2docx>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
