[project]
name = "converter-bot"
version = "2.2.0"
description = "Telegram-бот: .doc, .wps, .pdf и сканы страниц в .docx; в группах PDF ↔ DOCX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot>=21.5,<22",
    "python-dotenv>=1.0",
    "openai>=1.40",
    "python-docx>=1.1",
    "lxml>=5.0",
    "pillow>=10.0",
    # Чтение бинарных .doc/.wps: цвета границ, которые теряет LibreOffice.
    "olefile>=0.47",
    # Цифровые PDF → DOCX с вёрсткой (группы и режимы auto, reliability_first).
    "pdf2docx>=0.5",
    "pymupdf>=1.24",
    # OCR для режимов llm_first и reliability_first.
    "ocrmypdf>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
